name: Add session

# Manually triggered from the GitHub UI (Actions tab -> "Add session" -> "Run workflow").
# Give it a Google Sheets link and the session date; it downloads the sheet, re-runs the
# Elo tracker, and pushes the regenerated site data to main (which republishes Pages).
on:
  workflow_dispatch:
    inputs:
      sheet_url:
        description: 'Google Sheets URL for the session (poule sheet, with a "DE" tab)'
        required: true
        type: string
      session_date:
        description: 'Session date as YYYY-MM-DD (the Tuesday it was fenced)'
        required: true
        type: string

# Let the built-in GITHUB_TOKEN push the regenerated data back to the repo.
permissions:
  contents: write

# Avoid two runs racing to push at the same time.
concurrency:
  group: add-session
  cancel-in-progress: false

jobs:
  add-session:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl aiohttp

      - name: Validate date input
        run: |
          if ! [[ "${{ inputs.session_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::session_date must be in YYYY-MM-DD format, got '${{ inputs.session_date }}'"
            exit 1
          fi

      - name: Download the sheet
        working-directory: src/downloaded_sheets
        run: |
          python download_sheets.py \
            --url "${{ inputs.sheet_url }}" \
            --date "${{ inputs.session_date }}"

      - name: Re-run the Elo tracker
        working-directory: src
        run: python track_match_history.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (nothing new from this sheet)."
            exit 0
          fi
          git commit -m "Add session ${{ inputs.session_date }}"
          git push
